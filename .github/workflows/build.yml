name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7 and generate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Generating the wrapper here (rather than checking in a
      # pre-built gradlew/gradle-wrapper.jar) guarantees every future
      # run uses exactly Gradle 8.7 regardless of what Gradle version,
      # if any, happens to be preinstalled on the runner image — this
      # is what caused "Task 'assembleDebug' not found": the bare
      # `gradle` command on PATH was not reliably the one setup-gradle
      # just installed.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show Gradle/AGP diagnostic info
        run: ./gradlew --version

      - name: Show settings.gradle and build.gradle contents (diagnostic)
        run: |
          echo "=== settings.gradle ==="
          cat settings.gradle
          echo "=== root build.gradle ==="
          cat build.gradle
          echo "=== app/build.gradle ==="
          cat app/build.gradle
          echo "=== local.properties (if any) ==="
          cat local.properties 2>/dev/null || echo "(no local.properties present)"
          echo "=== ANDROID_HOME / ANDROID_SDK_ROOT env ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: List available tasks (diagnostic — helps debugging if this fails again)
        run: ./gradlew :app:tasks --all --console=plain --info 2>&1 | grep -A 5 -i "android\|namespace\|apply\|sdk" | head -100

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-to-touch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
